<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh; /* full viewport height */
            display: flex;
            justify-content: center; /* horizontal center */
            align-items: center;     /* vertical center */
            background-color: #f9f9f9;
        }

        .profile-container {
            width: 350px;
            padding: 20px;
            background-color: white;
            text-align: center;
            box-shadow: 0 0 5px rgba(0,0,0,0.1); /* optional light shadow */
            border-radius: 8px; /* rounded corners */
        }

        h2 {
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 10px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 5px;
            margin-top: 3px;
            box-sizing: border-box;
        }

        .buttons a {
            display: inline-block;
            margin-top: 15px;
            margin-right: 10px;
            padding: 7px 15px;
            background-color: #d63384;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .buttons a:hover {
            background-color: #c2186b;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <h2>My Profile</h2>

        <img class="profile-pic" src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=150" alt="Profile Picture">

        <label>Name</label>
        <input type="text" value="">

        <label>Email</label>
        <input type="email" value="">

        <label>Phone</label>
        <input type="text" value="">

        <label>Address</label>
        <input type="text" value="">

        <div class="buttons">
            <a href="#">Save Profile</a>
            <a href="#">Logout</a>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Products - Cart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* HEADER */
        header {
            background-color: #d63384;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        h1 {
            color: white;
            font-size: 24px;
        }

        .navbar {
            display: flex;
            gap: 20px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .navbar a:hover {
            color: #ffccdd;
        }

        /* CART */
        .cart {
            padding: 50px 30px;
            max-width: 700px;
            margin: 0 auto;
        }

        .cart h2 {
            font-size: 30px;
            color: #d63384;
            margin-bottom: 30px;
            text-align: center;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .cart-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 5px;
        }

        .cart-item h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 5px;
        }

        .cart-item p {
            color: #d63384;
            font-size: 16px;
        }

        .cart-item a {
            margin-left: auto;
            background-color: red;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
        }

        .cart-item a:hover {
            background-color: darkred;
        }

        /* TOTAL */
        .total {
            text-align: right;
            font-size: 20px;
            color: #333;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .total span {
            color: #d63384;
            font-weight: bold;
        }

        .checkout {
            display: block;
            background-color: #d63384;
            color: white;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            text-align: center;
            text-decoration: none;
        }

        .checkout:hover {
            background-color: #b02070;
        }

        /* FOOTER */
        footer {
            background-color: #d63384;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <h1>Beauty Products</h1>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="product.html">Product</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html">Add to Cart</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>

    <!-- CART -->
    <section class="cart">
        <h2>My Cart</h2>

        <div class="cart-item">
            <img src="" alt="Lipstick">
            <div>
                <h3>Lipstick</h3>
                <p>Rs. 1000</p>
            </div>
            <a href="#">Remove</a>
        </div>

        <div class="cart-item">
            <img src="" alt="Foundation">
            <div>
                <h3>Foundation</h3>
                <p>Rs. 2000</p>
            </div>
            <a href="#">Remove</a>
        </div>

        <div class="cart-item">
            <img src="" alt="Mascara">
            <div>
                <h3>Mascara</h3>
                <p>Rs. 1500</p>
            </div>
            <a href="#">Remove</a>
        </div>

        <p class="total">Total: <span>Rs. 4500</span></p>

        <a href="#" class="checkout">Checkout</a>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Beauty Products. All rights reserved.</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Products - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* HEADER */
        header {
            background-color: #d63384;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        h1 {
            color: white;
            font-size: 24px;
        }

        .navbar {
            display: flex;
            gap: 20px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .navbar a:hover {
            color: #ffccdd;
        }

        /* HERO */
        .hero {
            background-color: #ffccdd;
            text-align: center;
            padding: 80px 20px;
        }

        .hero h2 {
            font-size: 36px;
            color: #d63384;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            color: #555;
            margin-bottom: 25px;
        }

        .hero a {
            background-color: #d63384;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            font-size: 16px;
            border-radius: 5px;
        }

        .hero a:hover {
            background-color: #b02070;
        }

        /* PRODUCTS */
        .products {
            padding: 50px 30px;
            text-align: center;
        }

        .products h2 {
            font-size: 30px;
            color: #d63384;
            margin-bottom: 30px;
        }

        .product-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            width: 200px;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }

        .card h3 {
            font-size: 18px;
            margin: 10px 0 5px;
            color: #333;
        }

        .card p {
            color: #d63384;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .card a {
            background-color: #d63384;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
        }

        .card a:hover {
            background-color: #b02070;
        }

        /* FOOTER */
        footer {
            background-color: #d63384;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <h1>Beauty Products</h1>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="product.html">Product</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html">Add to Cart</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>

    <!-- HERO -->
    <section class="hero">
        <h2>Welcome to Beauty Products</h2>
        <p>Find the best cosmetics for you</p>
        <a href="product.html">Shop Now</a>
    </section>

    <!-- PRODUCTS -->
    <section class="products">
        <h2>Our Products</h2>
        <div class="product-container">

            <div class="card">
                <img src="" alt="Lipstick">
                <h3>Lipstick</h3>
                <p>Rs 450</p>
                <a href="cart.html">Add to Cart</a>
            </div>

            <div class="card">
                <img src="foundation.png" alt="Foundation">
                <h3>Foundation</h3>
                <p>Rs 1500</p>
                <a href="cart.html">Add to Cart</a>
            </div>

            <div class="card">
                <img src="mascara.jpg" alt="Mascara">
                <h3>Mascara</h3>
                <p>Rs 300</p>
                <a href="cart.html">Add to Cart</a>
            </div>

        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Beauty Products. All rights reserved.</p>
    </footer>

</body>
</html>
